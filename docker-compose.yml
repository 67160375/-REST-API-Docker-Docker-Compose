name: grid-pass-th

services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app       # แก้โค้ด backend ฝั่งเครื่อง เห็นผลทันที (ไม่ต้อง build ใหม่)
      - ./frontend:/app/frontend     # FastAPI serve ไฟล์ frontend จากโฟลเดอร์นี้
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data: