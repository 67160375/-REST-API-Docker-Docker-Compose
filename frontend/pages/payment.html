<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ชำระเงิน | Grid Pass</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="page-container">
    <div class="step-track">
      <span class="step done">1. ค้นหารายการแข่ง</span>
      <span class="step done">2. ดูรายละเอียด</span>
      <span class="step done">3. เลือกโซน</span>
      <span class="step done">4. กรอกข้อมูล</span>
      <span class="step active">5. ชำระเงิน</span>
      <span class="step">6. รับ e-Ticket</span>
    </div>

    <h1 class="page-title">ชำระเงิน</h1>
    <p class="page-subtitle">สแกน QR Code พร้อมเพย์ หรือกรอกข้อมูลบัตร</p>

    <div id="payment-content">
      <div class="skeleton">กำลังโหลดข้อมูลการชำระเงิน...</div>
    </div>

    <div id="error-box"></div>

    <button class="btn btn-primary btn-block" id="confirm-payment-btn">ยืนยันการชำระเงิน</button>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/payment.js"></script>
</body>
</html>
