<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ค้นหารายการแข่งขัน | Grid Pass</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="page-container">
    <div class="step-track">
      <span class="step active">1. ค้นหารายการแข่ง</span>
      <span class="step">2. ดูรายละเอียด</span>
      <span class="step">3. เลือกโซน</span>
      <span class="step">4. กรอกข้อมูล</span>
      <span class="step">5. ชำระเงิน</span>
      <span class="step">6. รับ e-Ticket</span>
    </div>

    <h1 class="page-title">ค้นหารายการแข่งขัน</h1>
    <p class="page-subtitle">เลือกดูรายการแข่งรถที่สนใจ วันที่จัด สถานที่สนาม และราคาเริ่มต้น</p>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="ค้นหา เช่น Thailand Super Series, มอเตอร์ไซค์..." />
      <button class="btn btn-primary" id="search-btn">ค้นหา</button>
    </div>

    <div id="race-grid" class="race-grid">
      <div class="skeleton">กำลังโหลดรายการแข่งขัน...</div>
    </div>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/races.js"></script>
</body>
</html>
