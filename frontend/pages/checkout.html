<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>กรอกข้อมูลผู้เข้าชม | Grid Pass</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="page-container">
    <div class="step-track">
      <span class="step done">1. ค้นหารายการแข่ง</span>
      <span class="step done">2. ดูรายละเอียด</span>
      <span class="step done">3. เลือกโซน</span>
      <span class="step active">4. กรอกข้อมูล</span>
      <span class="step">5. ชำระเงิน</span>
      <span class="step">6. รับ e-Ticket</span>
    </div>

    <h1 class="page-title">กรอกข้อมูลผู้เข้าชม</h1>
    <p class="page-subtitle">กรอกชื่อ-เบอร์โทรผู้ซื้อ และเลือกช่องทางชำระเงิน</p>

    <div id="summary-panel"></div>

    <form id="checkout-form">
      <div class="form-group">
        <label for="buyer-name">ชื่อ-นามสกุลผู้ซื้อ</label>
        <input type="text" id="buyer-name" required placeholder="เช่น สมชาย ใจดี" />
      </div>

      <div class="form-group">
        <label for="buyer-phone">เบอร์โทรศัพท์</label>
        <input type="tel" id="buyer-phone" required placeholder="เช่น 0812345678" pattern="0[0-9]{9}" />
      </div>

      <div class="form-group">
        <label>ช่องทางชำระเงิน</label>
        <div class="payment-options">
          <div class="payment-option selected" data-method="promptpay">
            <span class="icon">📱</span>พร้อมเพย์ / สแกน QR
          </div>
          <div class="payment-option" data-method="credit_card">
            <span class="icon">💳</span>บัตรเครดิต/เดบิต
          </div>
        </div>
      </div>

      <div id="error-box"></div>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">ไปหน้าชำระเงิน →</button>
    </form>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/checkout.js"></script>
</body>
</html>
