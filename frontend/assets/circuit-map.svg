<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ภาพผังสนาม "ชั่วคราว" (ภาพประกอบ ไม่ใช่ผังจริง) — รอเปลี่ยนเป็นภาพจริง
       ตำแหน่งอัฒจันทร์ในภาพนี้ตรงกับ ZONE_MAP_POSITIONS ใน backend/app/seed.py -->
  <rect width="1000" height="600" fill="#eef3e6"/>
  <g fill="#dfe8d2">
    <ellipse cx="480" cy="250" rx="220" ry="110"/>
    <ellipse cx="170" cy="200" rx="90" ry="60"/>
  </g>

  <!-- พิทเลน -->
  <path d="M 260 485 L 760 485" stroke="#c9c9c9" stroke-width="10" stroke-linecap="round"/>

  <!-- สนาม -->
  <path id="track" d="M 220 460 L 780 460 Q 850 460 850 400 L 850 300 Q 850 240 790 230 L 640 210 Q 600 205 590 170 L 570 110 Q 555 70 510 75 L 300 95 Q 240 100 230 150 L 260 250 Q 270 290 230 310 L 160 340 Q 120 360 130 410 Q 140 460 220 460 Z"
        fill="none" stroke="#3a3a3a" stroke-width="30" stroke-linejoin="round"/>
  <path d="M 220 460 L 780 460 Q 850 460 850 400 L 850 300 Q 850 240 790 230 L 640 210 Q 600 205 590 170 L 570 110 Q 555 70 510 75 L 300 95 Q 240 100 230 150 L 260 250 Q 270 290 230 310 L 160 340 Q 120 360 130 410 Q 140 460 220 460 Z"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="14 12" stroke-linejoin="round" opacity="0.7"/>

  <!-- เส้นสตาร์ท/เส้นชัย -->
  <g transform="translate(500 445)">
    <rect width="12" height="30" fill="#ffffff"/>
    <rect width="6" height="6" y="0" fill="#1c1c1c"/><rect width="6" height="6" x="6" y="6" fill="#1c1c1c"/>
    <rect width="6" height="6" y="12" fill="#1c1c1c"/><rect width="6" height="6" x="6" y="18" fill="#1c1c1c"/>
    <rect width="6" height="6" y="24" fill="#1c1c1c"/>
  </g>
  <text x="506" y="432" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="middle">START / FINISH</text>

  <!-- หมายเลขโค้ง -->
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
    <circle cx="870" cy="440" r="15" fill="#ff5a1f"/><text x="870" y="445" text-anchor="middle">1</text>
    <circle cx="820" cy="210" r="15" fill="#ff5a1f"/><text x="820" y="215" text-anchor="middle">2</text>
    <circle cx="540" cy="55" r="15" fill="#ff5a1f"/><text x="540" y="60" text-anchor="middle">3</text>
    <circle cx="210" cy="120" r="15" fill="#ff5a1f"/><text x="210" y="125" text-anchor="middle">4</text>
    <circle cx="285" cy="300" r="15" fill="#ff5a1f"/><text x="285" y="305" text-anchor="middle">5</text>
    <circle cx="105" cy="400" r="15" fill="#ff5a1f"/><text x="105" y="405" text-anchor="middle">6</text>
  </g>

  <!-- อัฒจันทร์ (ตำแหน่ง = ZONE_MAP_POSITIONS) -->
  <g font-family="sans-serif" font-weight="bold" fill="#5b5b5b" text-anchor="middle">
    <rect x="880" y="230" width="70" height="160" rx="8" fill="#ffffff" stroke="#b9b9b9" stroke-width="2"/>
    <text x="915" y="315" font-size="14" transform="rotate(90 915 310)">SIDE STAND</text>

    <rect x="320" y="490" width="320" height="70" rx="8" fill="#ffffff" stroke="#b9b9b9" stroke-width="2"/>
    <text x="480" y="531" font-size="16">GRANDSTAND</text>

    <rect x="660" y="490" width="120" height="70" rx="8" fill="#ffffff" stroke="#b9b9b9" stroke-width="2"/>
    <text x="720" y="531" font-size="15">VIP LOUNGE</text>
  </g>

  <text x="24" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1c1c1c">ผังสนาม (ภาพตัวอย่าง)</text>
  <text x="24" y="64" font-family="sans-serif" font-size="14" fill="#6b6b6b">ภาพประกอบเท่านั้น ไม่ใช่ผังสนามจริง</text>
</svg>
